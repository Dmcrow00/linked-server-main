# ============================================================
#  LINKED API - configuración común a todos los perfiles
#  Perfiles: dev (local), prod (producción). Los tests usan el perfil test.
#  Ningún valor de producción vive acá: los secretos llegan por variables de entorno.
# ============================================================

spring:
  application:
    name: linked-api

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        # Carga en lote las relaciones diferidas (imágenes, mensajes, roles) al armar
        # listados, en lugar de hacer una consulta por cada entidad.
        default_batch_fetch_size: 50
        jdbc:
          time_zone: America/Argentina/Buenos_Aires

  flyway:
    # Solo la carpeta de linked: db/migration/swe es de core-swe y tiene su propio historial.
    locations: classpath:db/migration/linked
    # Las bases que vienen del backend Node ya tenían las tablas: se toman como V1.
    baseline-on-migrate: true

  # Hilos de @Async (mails y sincronizaciones de Instagram en segundo plano).
  task:
    execution:
      thread-name-prefix: linked-async-
      pool:
        core-size: 2
        max-size: 5
        queue-capacity: 100

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 30MB

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
  # El mail no es crítico: si el SMTP no responde, la app igual atiende (y Fly no la reinicia).
  health:
    mail:
      enabled: false

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

app:
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:4200,http://localhost:3000}

  jwt:
    secret: ${JWT_SECRET:}
    expiration: ${JWT_EXPIRATION:86400000}   # 24 horas en ms

  rsa:
    private-key-pem: ${RSA_PRIVATE_KEY:}

  swe:
    migraciones:
      # Las V1..V16 de linked crearon swe_*: core-swe corre después y solo completa (ADR-0003 de dmc00-core).
      orden: DESPUES_DE_LA_APP
    # Rol que viaja en el claim "rol" del JWT cuando un usuario tiene varios.
    jerarquia-de-roles: Administrador,Moderador,Tatuador,Cliente

  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:}
    api-key: ${CLOUDINARY_API_KEY:}
    api-secret: ${CLOUDINARY_API_SECRET:}

  instagram:
    app-id: ${META_APP_ID:}
    app-secret: ${META_APP_SECRET:}
    redirect-uri: ${META_REDIRECT_URI:http://localhost:8080/api/instagram/callback}
    graph-api-version: v21.0
    sincronizacion:
      # Como el scheduler de Node: cada 2 h, la primera un minuto después de arrancar.
      # Formato ISO-8601 (PT2H): lo lee también @Scheduled.
      cada: ${INSTAGRAM_SYNC_INTERVAL:PT2H}
      demora-inicial: PT1M
      # Renueva el token cuando le quedan menos días que esto.
      renovar-antes-de: 30d
      # Un token vencido desvincula la cuenta. En dev se desactiva: el servidor no corre siempre.
      desvincular-vencidos: true

  frontend:
    base-url: ${FRONT_BASE_URL:http://localhost:4200}

  recaptcha:
    enabled: false
    secret-key: ${RECAPTCHA_SECRET_KEY:}

  news:
    api-key: ${NEWS_API_KEY:}

  mail:
    from: ${MAIL_FROM:noreply@linked-app.com}
