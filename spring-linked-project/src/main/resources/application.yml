# ============================================================
#  CONFIGURACION PRINCIPAL - LINKED API
#  Propiedades compartidas entre perfiles.
#  Sobreescribir especificas en application-dev.yml / application-prod.yml
# ============================================================

spring:
  application:
    name: linked-api

  profiles:
    active: dev

  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        # Carga en lote las relaciones diferidas (imágenes, mensajes, roles) al armar
        # listados, en lugar de hacer una consulta por cada entidad.
        default_batch_fetch_size: 50
        jdbc:
          time_zone: America/Argentina/Buenos_Aires

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration/linked

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 30MB

server:
  port: 8080
  servlet:
    context-path: /

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

# ── Propiedades custom de la aplicacion ──
app:
  cors:
    allowed-origins: http://localhost:4200,http://localhost:3000

  jwt:
    secret: dGhpcyBpcyBhIHNhbXBsZSBzZWNyZXQga2V5IGZvciBkZXZlbG9wbWVudCB1c2Ugb25seSAtIERPIE5PVCBVU0UgSU4gUFJPRFVDVElPTiE=
    expiration: 86400000   # 24 horas en ms

  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:dev-cloud}
    api-key: ${CLOUDINARY_API_KEY:}
    api-secret: ${CLOUDINARY_API_SECRET:}

  instagram:
    app-id: ${META_APP_ID:}
    app-secret: ${META_APP_SECRET:}
    redirect-uri: ${META_REDIRECT_URI:http://localhost:8080/api/instagram/callback}
    graph-api-version: v21.0

  frontend:
    base-url: ${FRONT_BASE_URL:http://localhost:4200}

  recaptcha:
    secret-key: ${RECAPTCHA_SECRET_KEY:}
    enabled: false   # Habilitar en produccion

  news:
    api-key: ${NEWS_API_KEY:}

  mail:
    from: noreply@linked-app.com
