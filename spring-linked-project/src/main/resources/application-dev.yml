# ============================================================
#  PERFIL: DESARROLLO (dev)
#  ./mvnw spring-boot:run -Dspring-boot.run.profiles=dev
#  Los valores locales (contraseña de la base, claves de Cloudinary/Meta) van en .env,
#  que no se versiona: copiar .env.example.
# ============================================================

spring:
  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/linked-main-db}
    username: ${DATABASE_USER:postgres}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      connection-timeout: 20000

  jpa:
    show-sql: true

  mail:
    host: localhost
    port: 1025        # MailHog o Mailpit
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

app:
  jwt:
    # También en dev viene de .env (JWT_SECRET): ningún secreto vive en el repo, que es público.
    secret: ${JWT_SECRET}
  rsa:
    # Par RSA de desarrollo: se genera la primera vez en este archivo (ignorado por git).
    key-path: rsa-privada.pem
    # Acepta contraseñas sin cifrar para probar desde Swagger o Postman.
    plaintext-fallback: true
  instagram:
    sincronizacion:
      desvincular-vencidos: false
  # Contraseña que AdminSemillaDevRunner le pone al admin semilla (vacía = no la toca).
  dev:
    admin-password: ${ADMIN_DEV_PASSWORD:}

logging:
  level:
    root: INFO
    com.linked: DEBUG
    org.hibernate.SQL: DEBUG
