# ============================================================
#  PERFIL: PRODUCCIÓN (prod)
#  Los secretos sin valor por defecto son obligatorios: si falta uno, la app no arranca.
#  Lista completa en .env.example y docs/guia-entorno-local-y-despliegue.md.
# ============================================================

spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000

  jpa:
    show-sql: false

  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  cors:
    allowed-origins: ${CORS_ORIGINS}
  jwt:
    secret: ${JWT_SECRET}
  rsa:
    # Misma clave en todas las máquinas y despliegues; sin ella el cliente no puede cifrar contraseñas.
    private-key-pem: ${RSA_PRIVATE_KEY}
  recaptcha:
    enabled: true
    secret-key: ${RECAPTCHA_SECRET_KEY}
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME}
    api-key: ${CLOUDINARY_API_KEY}
    api-secret: ${CLOUDINARY_API_SECRET}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    root: WARN
    com.linked: INFO
