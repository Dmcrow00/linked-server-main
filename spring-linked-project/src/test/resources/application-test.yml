# Perfil de los tests de integración. La base es un PostgreSQL de Testcontainers
# (PostgresContenedor de core-test): Flyway corre las migraciones como en producción.
# Las integraciones externas (Cloudinary, Instagram, mail) se reemplazan por dobles (DoblesDePrueba).

spring:
  mail:
    host: localhost
    port: 3025

app:
  jwt:
    secret: dGVzdFNlY3JldEtleUZvclVuaXRUZXN0c09ubHlOb3RGb3JQcm9kdWN0aW9uVXNlQXRBbGw=
  rsa:
    key-path: target/rsa-de-prueba.pem
  cloudinary:
    cloud-name: prueba
    api-key: prueba
    api-secret: prueba
  instagram:
    app-id: app-de-prueba
    app-secret: secreto-de-prueba
    sincronizacion:
      # La tarea programada no corre durante los tests: se invoca a mano.
      demora-inicial: PT24H
